<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="snowflake-source" content="cortex-agent-authored" />
  <base target="_top" />
  <script type="application/json" id="snowflake-report-metadata">
  {
    "generated": "2026-10-16",
    "intent": "Weekly partner news digest viewer, Apps Script web app",
    "dataSources": [
      { "type": "gdrive-folder", "id": "1ePyr-PclAiCu3f94X0Utx9htXrgIpmWg",
        "files": "digest-YYYY-MM-DD.md", "producer": "skills/partner-news (plugin-partner-news repo)" }
    ],
    "sections": [
      { "id": "digest", "title": "Selected week",
        "producerNotes": "Loaded at runtime via google.script.run listDigests/getDigest in Code.gs; nothing is embedded." }
    ]
  }
  </script>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
      line-height: 1.5;
      max-width: 880px; width: 100%; box-sizing: border-box;
      margin: 0 auto; padding: clamp(16px, 4vw, 24px);
      color: light-dark(#1f2937, #e5e7eb);
      background: light-dark(#ffffff, #0b1220);
    }
    h1, h2, h3 { color: light-dark(#0f172a, #f1f5f9); line-height: 1.25; }
    h1 { font-size: 1.6rem; margin: 0.4em 0; }
    h2 { font-size: 1.2rem; margin-top: 1.6em; padding-bottom: 4px;
         border-bottom: 1px solid light-dark(#e5e7eb, #1f2937); }
    h3 { font-size: 1.02rem; margin-top: 1.2em; }
    a { color: light-dark(#0b6bcb, #60a5fa); overflow-wrap: anywhere; }
    code { font-size: 0.9em; background: light-dark(#f3f4f6, #1f2937); padding: 1px 4px; border-radius: 4px; }
    ul { padding-left: 1.2em; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
           padding: 10px 0; border-bottom: 1px solid light-dark(#e5e7eb, #1f2937); }
    .bar label { font-weight: 600; }
    select { font: inherit; padding: 4px 8px; border-radius: 6px; max-width: 100%;
             border: 1px solid light-dark(#d1d5db, #374151);
             background: light-dark(#fff, #111827); color: inherit; }
    .muted { color: light-dark(#6b7280, #9ca3af); font-size: 0.9rem; }
    .error { color: light-dark(#b91c1c, #f87171); }
  </style>
</head>
<body>
  <div class="bar">
    <label for="week">Week</label>
    <select id="week" disabled><option>Loading...</option></select>
    <span id="status" class="muted"></span>
  </div>
  <main id="digest"><p class="muted">Loading digests from Google Drive...</p></main>

  <script>
    // Minimal, safe Markdown renderer for the digest format:
    // headings, bullet lists, paragraphs, **bold**, `code`, [text](https://..) and bare URLs.
    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function link(url, text) {
      return /^https?:\/\//i.test(url)
        ? '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + text + '</a>'
        : text;
    }
    function inline(raw) {
      var s = esc(raw);
      var parts = [];  // keep code spans and links out of later replacements
      function keep(html) { parts.push(html); return '\u0000' + (parts.length - 1) + '\u0000'; }
      s = s.replace(/`([^`]+)`/g, function (_, c) { return keep('<code>' + c + '</code>'); });
      s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, t, u) { return keep(link(u, t)); });
      s = s.replace(/https?:\/\/[^\s<]+/g, function (u) { return keep(link(u, u)); });
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return parts[+i]; });
    }
    function render(md) {
      var out = [], para = [], inList = false;
      function flushPara() { if (para.length) { out.push('<p>' + para.join('<br>') + '</p>'); para = []; } }
      function closeList() { if (inList) { out.push('</ul>'); inList = false; } }
      md.split(/\r?\n/).forEach(function (line) {
        var h = line.match(/^(#{1,3})\s+(.*)$/);
        if (h) {
          flushPara(); closeList();
          var n = h[1].length;
          out.push('<h' + n + '>' + inline(h[2]) + '</h' + n + '>');
        } else if (/^\s*-\s+/.test(line)) {
          flushPara();
          if (!inList) { out.push('<ul>'); inList = true; }
          out.push('<li>' + inline(line.replace(/^\s*-\s+/, '')) + '</li>');
        } else if (!line.trim()) {
          flushPara(); closeList();
        } else {
          closeList(); para.push(inline(line));
        }
      });
      flushPara(); closeList();
      return out.join('\n');
    }

    var weekEl = document.getElementById('week');
    var digestEl = document.getElementById('digest');
    var statusEl = document.getElementById('status');

    function showError(err) {
      digestEl.innerHTML = '<p class="error">Could not load: ' + esc(String(err && err.message || err)) + '</p>';
      statusEl.textContent = '';
    }
    function load(id) {
      statusEl.textContent = 'Loading...';
      google.script.run
        .withSuccessHandler(function (md) { digestEl.innerHTML = render(md); statusEl.textContent = ''; window.scrollTo(0, 0); })
        .withFailureHandler(showError)
        .getDigest(id);
    }

    weekEl.addEventListener('change', function () { load(weekEl.value); });

    google.script.run
      .withSuccessHandler(function (list) {
        if (!list.length) { digestEl.innerHTML = '<p class="muted">No digests in the folder yet.</p>'; weekEl.innerHTML = ''; return; }
        weekEl.innerHTML = list.map(function (d) {
          return '<option value="' + esc(d.id) + '">Week ending ' + esc(d.date) + '</option>';
        }).join('');
        weekEl.disabled = false;
        statusEl.textContent = list.length + (list.length === 1 ? ' digest' : ' digests');
        load(list[0].id);
      })
      .withFailureHandler(showError)
      .listDigests();
  </script>
</body>
</html>
